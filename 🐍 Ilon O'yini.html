<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Orbitron:wght@400;700;900&display=swap');

  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --border: #1e1e2e;
    --green: #00ff88;
    --green-dim: #00cc66;
    --red: #ff3366;
    --gold: #ffd700;
    --text: #e0e0ff;
    --muted: #555577;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Orbitron', monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    min-height: 100vh;
    overflow: hidden;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 20% 20%, rgba(0,255,136,0.05) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 80%, rgba(255,51,102,0.05) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  .grid-bg {
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,255,136,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,255,136,0.03) 1px, transparent 1px);
    background-size: 30px 30px;
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }

  .header {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .title {
    font-family: 'Press Start 2P', monospace;
    font-size: 14px;
    color: var(--green);
    text-shadow: 0 0 20px var(--green);
    letter-spacing: 2px;
  }

  .score-board {
    display: flex;
    gap: 16px;
  }

  .score-item {
    text-align: center;
  }

  .score-label {
    font-size: 8px;
    color: var(--muted);
    letter-spacing: 1px;
    display: block;
  }

  .score-value {
    font-family: 'Press Start 2P', monospace;
    font-size: 14px;
    color: var(--gold);
    text-shadow: 0 0 10px rgba(255,215,0,0.5);
  }

  .canvas-wrapper {
    position: relative;
    border: 2px solid var(--green);
    box-shadow:
      0 0 30px rgba(0,255,136,0.2),
      inset 0 0 30px rgba(0,255,136,0.03);
    border-radius: 8px;
    overflow: hidden;
  }

  canvas {
    display: block;
    background: var(--surface);
  }

  /* Overlay screens */
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(10,10,15,0.92);
    backdrop-filter: blur(4px);
    gap: 20px;
    z-index: 10;
    transition: opacity 0.3s;
  }

  .overlay.hidden { display: none; }

  .overlay-title {
    font-family: 'Press Start 2P', monospace;
    font-size: 20px;
    color: var(--green);
    text-shadow: 0 0 30px var(--green);
    text-align: center;
    line-height: 1.6;
    animation: pulse 2s ease-in-out infinite;
  }

  .overlay-title.dead {
    color: var(--red);
    text-shadow: 0 0 30px var(--red);
  }

  .overlay-score {
    font-family: 'Press Start 2P', monospace;
    font-size: 13px;
    color: var(--gold);
    text-shadow: 0 0 15px rgba(255,215,0,0.6);
  }

  .btn {
    font-family: 'Press Start 2P', monospace;
    font-size: 11px;
    padding: 14px 28px;
    border: 2px solid var(--green);
    background: transparent;
    color: var(--green);
    cursor: pointer;
    letter-spacing: 2px;
    text-transform: uppercase;
    transition: all 0.2s;
    border-radius: 4px;
    position: relative;
    overflow: hidden;
  }

  .btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--green);
    transform: translateX(-100%);
    transition: transform 0.2s;
    z-index: -1;
  }

  .btn:hover::before, .btn:active::before { transform: translateX(0); }
  .btn:hover, .btn:active { color: var(--bg); box-shadow: 0 0 20px var(--green); }

  /* Level indicator */
  .level-bar {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .level-label {
    font-size: 9px;
    color: var(--muted);
    white-space: nowrap;
  }

  .level-track {
    flex: 1;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }

  .level-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--green), var(--gold));
    border-radius: 2px;
    transition: width 0.3s;
    box-shadow: 0 0 8px var(--green);
  }

  .level-num {
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    color: var(--green);
  }

  /* D-pad controls */
  .dpad {
    display: grid;
    grid-template-columns: repeat(3, 56px);
    grid-template-rows: repeat(3, 56px);
    gap: 6px;
    margin-top: 4px;
  }

  .dpad-btn {
    width: 56px;
    height: 56px;
    border: 2px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 22px;
    cursor: pointer;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.1s;
    user-select: none;
    -webkit-user-select: none;
  }

  .dpad-btn:active {
    background: var(--green);
    border-color: var(--green);
    color: var(--bg);
    transform: scale(0.92);
    box-shadow: 0 0 15px var(--green);
  }

  .dpad-center {
    background: var(--border);
    border-color: transparent;
    pointer-events: none;
  }

  .dpad-empty { visibility: hidden; }

  .hint {
    font-size: 8px;
    color: var(--muted);
    letter-spacing: 1px;
    text-align: center;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.6; }
  }

  @keyframes flash {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }
</style>
</head>
<body>
<div class="grid-bg"></div>

<div class="container">
  <div class="header">
    <div class="title">🐍 GREEN BITCH</div>
    <div class="score-board">
      <div class="score-item">
        <span class="score-label">BALL</span>
        <span class="score-value" id="score">0</span>
      </div>
      <div class="score-item">
        <span class="score-label">REKORD</span>
        <span class="score-value" id="high-score">0</span>
      </div>
    </div>
  </div>

  <div class="level-bar">
    <span class="level-label">DARAJA</span>
    <div class="level-track">
      <div class="level-fill" id="level-fill" style="width:0%"></div>
    </div>
    <span class="level-num" id="level-num">1</span>
  </div>

  <div class="canvas-wrapper">
    <canvas id="gameCanvas" width="380" height="380"></canvas>

    <!-- Start screen -->
    <div class="overlay" id="start-screen">
      <div class="overlay-title">🐍 GREEN<br>BITCH GAME</div>
      <div style="font-size:10px; color:var(--muted); text-align:center; line-height:2; font-family:&#39;Press Start 2P&#39;,monospace;">WASSUP MA<br>N WORD</div>
      <button class="btn" id="start-btn">▶ STFU</button>
    </div>

    <!-- Game over screen -->
    <div class="overlay hidden" id="gameover-screen">
      <div class="overlay-title dead">💀 O'YIN<br>TUGADI!</div>
      <div class="overlay-score" id="final-score">BALL: 0</div>
      <div style="font-size:9px; color:var(--muted); font-family:&#39;Press Start 2P&#39;,monospace;" id="new-record" class="hidden"></div>
      <button class="btn" id="restart-btn">🔄 QAYTA</button>
    </div>
  </div>

  <!-- D-pad -->
  <div class="dpad">
    <div class="dpad-empty"></div>
    <button class="dpad-btn" id="btn-up">▲</button>
    <div class="dpad-empty"></div>
    <button class="dpad-btn" id="btn-left">◀</button>
    <div class="dpad-btn dpad-center">✦</div>
    <button class="dpad-btn" id="btn-right">▶</button>
    <div class="dpad-empty"></div>
    <button class="dpad-btn" id="btn-down">▼</button>
    <div class="dpad-empty"></div>
  </div>

  <div class="hint">KLAVIATURA YOKI TUGMALAR BILAN BOSHQARING</div>
</div>

<script>
  // Telegram WebApp init
  if (window.Telegram?.WebApp) {
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();
  }

  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  // Responsive canvas size
  const maxW = Math.min(window.innerWidth - 32, 388);
  const CELL = Math.floor(maxW / 20);
  const COLS = 20, ROWS = 20;
  canvas.width = COLS * CELL;
  canvas.height = ROWS * CELL;

  // Game state
  let snake, dir, nextDir, food, score, highScore, level, gameLoop, running, foodCount;

  highScore = parseInt(localStorage.getItem('snakeHS') || '0');
  document.getElementById('high-score').textContent = highScore;

  function initGame() {
    snake = [
      { x: 10, y: 10 },
      { x: 9, y: 10 },
      { x: 8, y: 10 },
    ];
    dir = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    score = 0;
    level = 1;
    foodCount = 0;
    running = true;
    updateScore(0);
    updateLevel();
    placeFood();
  }

  function placeFood() {
    let pos;
    do {
      pos = {
        x: Math.floor(Math.random() * COLS),
        y: Math.floor(Math.random() * ROWS)
      };
    } while (snake.some(s => s.x === pos.x && s.y === pos.y));
    food = pos;
  }

  function updateScore(val) {
    score = val;
    document.getElementById('score').textContent = score;
    if (score > highScore) {
      highScore = score;
      localStorage.setItem('snakeHS', highScore);
      document.getElementById('high-score').textContent = highScore;
    }
  }

  function updateLevel() {
    const newLevel = Math.floor(foodCount / 5) + 1;
    level = Math.min(newLevel, 10);
    document.getElementById('level-num').textContent = level;
    const pct = ((foodCount % 5) / 5) * 100;
    document.getElementById('level-fill').style.width = pct + '%';
  }

  function getSpeed() {
    return Math.max(80, 220 - (level - 1) * 15);
  }

  // Drawing
  function draw() {
    ctx.fillStyle = '#12121a';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Grid
    ctx.strokeStyle = 'rgba(30,30,46,0.8)';
    ctx.lineWidth = 0.5;
    for (let x = 0; x <= COLS; x++) {
      ctx.beginPath();
      ctx.moveTo(x * CELL, 0);
      ctx.lineTo(x * CELL, canvas.height);
      ctx.stroke();
    }
    for (let y = 0; y <= ROWS; y++) {
      ctx.beginPath();
      ctx.moveTo(0, y * CELL);
      ctx.lineTo(canvas.width, y * CELL);
      ctx.stroke();
    }

    // Food
    const fx = food.x * CELL + CELL / 2;
    const fy = food.y * CELL + CELL / 2;
    const r = CELL / 2 - 2;

    // Glow
    const grd = ctx.createRadialGradient(fx, fy, 0, fx, fy, r * 2);
    grd.addColorStop(0, 'rgba(255,51,102,0.4)');
    grd.addColorStop(1, 'transparent');
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.arc(fx, fy, r * 2, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#ff3366';
    ctx.shadowColor = '#ff3366';
    ctx.shadowBlur = 15;
    ctx.beginPath();
    ctx.arc(fx, fy, r - 1, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    // Snake
    snake.forEach((seg, i) => {
      const x = seg.x * CELL;
      const y = seg.y * CELL;
      const pad = i === 0 ? 1 : 2;
      const size = CELL - pad * 2;

      if (i === 0) {
        // Head
        ctx.fillStyle = '#00ff88';
        ctx.shadowColor = '#00ff88';
        ctx.shadowBlur = 12;
      } else {
        // Body gradient
        const t = i / snake.length;
        const g = Math.floor(255 * (1 - t * 0.6));
        ctx.fillStyle = `rgb(0, ${g}, ${Math.floor(g * 0.5)})`;
        ctx.shadowBlur = 4;
        ctx.shadowColor = '#00ff88';
      }

      const radius = i === 0 ? 5 : 3;
      ctx.beginPath();
      ctx.roundRect(x + pad, y + pad, size, size, radius);
      ctx.fill();
      ctx.shadowBlur = 0;

      // Eyes on head
      if (i === 0) {
        ctx.fillStyle = '#0a0a0f';
        const eyeSize = CELL / 8;
        const ex1 = x + CELL * 0.3;
        const ex2 = x + CELL * 0.7;
        const ey = y + CELL * 0.3;

        if (dir.x !== 0) {
          // Moving horizontally
          const ey1 = y + CELL * 0.3;
          const ey2 = y + CELL * 0.65;
          const ex = dir.x > 0 ? x + CELL * 0.7 : x + CELL * 0.3;
          ctx.beginPath(); ctx.arc(ex, ey1, eyeSize, 0, Math.PI * 2); ctx.fill();
          ctx.beginPath(); ctx.arc(ex, ey2, eyeSize, 0, Math.PI * 2); ctx.fill();
        } else {
          ctx.beginPath(); ctx.arc(ex1, ey, eyeSize, 0, Math.PI * 2); ctx.fill();
          ctx.beginPath(); ctx.arc(ex2, ey, eyeSize, 0, Math.PI * 2); ctx.fill();
        }
      }
    });
  }

  function step() {
    if (!running) return;

    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    // Wall collision
    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
      gameOver(); return;
    }

    // Self collision
    if (snake.some(s => s.x === head.x && s.y === head.y)) {
      gameOver(); return;
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      foodCount++;
      updateScore(score + level * 10);
      updateLevel();
      clearInterval(gameLoop);
      gameLoop = setInterval(step, getSpeed());
      placeFood();
    } else {
      snake.pop();
    }

    draw();
  }

  function gameOver() {
    running = false;
    clearInterval(gameLoop);

    if (window.Telegram?.WebApp) {
      Telegram.WebApp.HapticFeedback.notificationOccurred('error');
    }

    document.getElementById('final-score').textContent = 'BALL: ' + score;
    const rec = document.getElementById('new-record');
    if (score >= highScore && score > 0) {
      rec.textContent = '🏆 YANGI REKORD!';
      rec.style.color = 'var(--gold)';
      rec.style.fontFamily = "'Press Start 2P', monospace";
      rec.style.fontSize = '10px';
      rec.classList.remove('hidden');
    } else {
      rec.classList.add('hidden');
    }

    document.getElementById('gameover-screen').classList.remove('hidden');
  }

  function startGame() {
    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('gameover-screen').classList.add('hidden');
    initGame();
    draw();
    clearInterval(gameLoop);
    gameLoop = setInterval(step, getSpeed());
  }

  // Controls
  document.getElementById('start-btn').addEventListener('click', startGame);
  document.getElementById('restart-btn').addEventListener('click', startGame);

  document.getElementById('btn-up').addEventListener('click', () => { if (dir.y !== 1) nextDir = { x: 0, y: -1 }; });
  document.getElementById('btn-down').addEventListener('click', () => { if (dir.y !== -1) nextDir = { x: 0, y: 1 }; });
  document.getElementById('btn-left').addEventListener('click', () => { if (dir.x !== 1) nextDir = { x: -1, y: 0 }; });
  document.getElementById('btn-right').addEventListener('click', () => { if (dir.x !== -1) nextDir = { x: 1, y: 0 }; });

  // Keyboard
  document.addEventListener('keydown', e => {
    switch(e.key) {
      case 'ArrowUp': case 'w': case 'W': if (dir.y !== 1) nextDir = { x: 0, y: -1 }; e.preventDefault(); break;
      case 'ArrowDown': case 's': case 'S': if (dir.y !== -1) nextDir = { x: 0, y: 1 }; e.preventDefault(); break;
      case 'ArrowLeft': case 'a': case 'A': if (dir.x !== 1) nextDir = { x: -1, y: 0 }; e.preventDefault(); break;
      case 'ArrowRight': case 'd': case 'D': if (dir.x !== -1) nextDir = { x: 1, y: 0 }; e.preventDefault(); break;
    }
  });

  // Swipe support
  let touchStartX, touchStartY;
  canvas.addEventListener('touchstart', e => {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
    e.preventDefault();
  }, { passive: false });

  canvas.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    if (Math.abs(dx) > Math.abs(dy)) {
      if (dx > 20 && dir.x !== -1) nextDir = { x: 1, y: 0 };
      else if (dx < -20 && dir.x !== 1) nextDir = { x: -1, y: 0 };
    } else {
      if (dy > 20 && dir.y !== -1) nextDir = { x: 0, y: 1 };
      else if (dy < -20 && dir.y !== 1) nextDir = { x: 0, y: -1 };
    }
    e.preventDefault();
  }, { passive: false });

  // Initial draw
  draw();
</script>
